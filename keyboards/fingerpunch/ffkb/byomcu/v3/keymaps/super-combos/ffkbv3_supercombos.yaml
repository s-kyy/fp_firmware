layout:
  qmk_keyboard: torn
  qmk_layout: LAYOUT_split_3x6_4
  # qmk_keyboard: fingerpunch/ffkb_byomcu/v3
  # qmk_layout: LAYOUT
layers:
  COLEMAK:
    - [M1, Q, W, F, P, B, J, L, U, Y, DEL, BKSP]
    - [CTRL, A, R, S, T, G, M, N, E, I, O, /]
    - [M2, Z, X, C, D, V, K, H, ',', ., "'", Menu]
    - {t: Mute, type: ghost}
    - {h: "", t: LAlt }
    - {h: SYM Scroll, t: Enter}
    - {h: MCR, t: "Ctrl Tab"}
    - {h: "", t: Shift}
    - {h: NAV, t: Space}
    - "BKSP"
    - {t: RAlt, type: ghost}
  SYMBOL:
    - [null, 1, 2, 3, 4, 5, Num, 7, 8, 9, null, null]
    - [LDesk, "|", "=", "_", "-", "*", ".", 4, 5, 6, "+", RDesk]
    - [null, null,  null, "&", "^", null, 0, 1, 2, 3, \,null]
    - {t: Mute, type: ghost}
    - null
    - {type: held, h: SYM}
    - null
    - null
    - null
    - 'Alt-Tab'
    - {t: EE_CLR, type: ghost}
  Macros:
    - [Esc, null, Ctrl Shift V, Undo, G-Paste, TO( QWERTY),  null, Bright +, Bright -, MusicB Vol-, MusicB Vol+, null]
    - [LDESK, Ctrl A, Cut, Copy, Paste, null,                    Zoom In, MusicB Prev, MusicB Play/ Pause, MusicB Next, Music Bee, RDESK]
    - [null, null, null, Redo, Screen Shot, TO( COLEMAK),     Zoom Out, Print Screen, Scroll Lock, Pause, null, null ]
    - {t: Mute, type: ghost}
    - null
    - null
    - {type: held, h: MCR}
    - null
    - null
    - null
    - {t: EE_CLR, type: ghost}
  Navigation:
    - [Esc, RGB_ TOG, RGB_ MOD-, RGB_ MOD+, RGB_HU-, RGB_HU+, PgUp, Home, Up, End, Del, null]
    - [EXIT PARSEC, Gui,  Alt,  Shift, Ctrl, MEH,    PgDn, Left, Down, Right, Bspace, Insert]
    - [F12,  F1, F2, F3, F4, F5,                     F6, F7, F8, F9, F10, F11]
    - {t: Boot, type: ghost}
    - null
    - null
    - null
    - null
    - {type: held, h: NAV}
    - null
    - {t: RAlt, type: ghost}
  QWERTY:
    - [Tab, Q, W, E, R, T, Y, U, I, O, P, Bspace]
    - [Ctrl, A, S, D, F, G, H, J, K, L, ;, "'"]
    - [Shift, Z, X, C, V, B, N, M, ',', ., /, Mouse2]
    - {t: Mute, type: ghost}
    - "Mouse1"
    - {h: SYM Scroll, t: Space}
    - {h: MCR, t: Enter}
    - "Space"
    - {h: Nav, t: Space}
    - "LAlt"
    - {t: RAlt, type: ghost}
combos: 
  - {p: [25,26], k: 'Gui', l: [COLEMAK]}
  - {p: [26,27], k: 'Alt', l: [COLEMAK]}
  - {p: [32,33], k: 'Alt', l: [COLEMAK]}
  - {p: [33,34], k: 'Gui', l: [COLEMAK]}
  - {p: [16,17], k: '`', l: [COLEMAK]}
  - {p: [18,19], k: '~', l: [COLEMAK]}
  - {p: [17,18], k: 'CAPS', l: [COLEMAK]}
