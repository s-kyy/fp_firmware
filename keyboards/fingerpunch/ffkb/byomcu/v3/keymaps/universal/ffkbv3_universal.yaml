layout:
  qmk_keyboard: torn
  qmk_layout: LAYOUT_split_3x6_4
  # qmk_keyboard: fingerpunch/ffkb_byomcu/v3
  # qmk_layout: LAYOUT
layers:
  COLEMAK:
    - [Esc, Q, W, F, P, B, J, L, U, Y, ;, Bspace]
    - [CTRL, A, R, S, T, G, M, N, E, I, O, "'"]
    - [Shift, Z, X, C, D, V, K, H, ',', ., /, Menu]
    - {t: Mute, type: ghost}
    - {h: "", t: Mouse1 }
    - {h: SYM Scroll, t: Enter}
    - {h: MCR, t: Mouse2}
    - {h: "", t: Tab}
    - {h: NAV, t: Space}
    - "LAlt"
    - {t: RAlt, type: ghost}
  SYMBOL:
    - [Esc, "[,{", "7", "8", "9", "],}", null,Alt Tab, Ctrl Tab, null, Bspace, Del]
    - [LDesk, "=,+", 1, 2, 3, 0, Calc, Ctrl, Shift, Alt, Gui, RDesk]
    - [null, "|",  4, 5, 6, "-,_", '', '_', ';,:', '.', \,null]
    - {t: Mute, type: ghost}
    - null
    - {type: held, h: SYM}
    - null
    - null
    - '-'
    - '_'
    - {t: EE_CLR, type: ghost}
  Macros:
    - [Esc, TaskMan, Ctrl Shift V, Undo, G-Paste, TO( QWERTY),  Num, Bright +, Bright -, MusicB Vol-, MusicB Vol+, null]
    - [null, null, Cut, Copy, Paste, Ctrl A,                    null, MusicB Prev, MusicB Play/ Pause, MusicB Next, Music Bee, null]
    - [null, null, MyComp, Redo, Screen Shot, TO( COLEMAK),     null, Print Screen, Scroll Lock, Pause, null, null ]
    - {t: Mute, type: ghost}
    - null
    - null
    - {type: held, h: MCR}
    - "Mouse3"
    - "Zoom Out"
    - "Zoom In"
    - {t: EE_CLR, type: ghost}
  Navigation:
    - [Esc, null, RGB_ TOG, RGB_ MOD-, RGB_ MOD+, EXIT PARSEC, PgUp, Home, Up, End, Del, null]
    - [null, Gui,  Alt,  Shift, Ctrl, MEH,                   PgDn, Left, Down, Right, Bspace, Insert]
    - [F12,  F1, F2, F3, F4, F5,                             F6, F7, F8, F9, F10, F11]
    - {t: Boot, type: ghost}
    - null
    - null
    - null
    - null
    - {type: held, h: NAV}
    - null
    - {t: RAlt, type: ghost}
  QWERTY:
    - [Tab, Q, W, E, R, T, Y, U, I, O, P, Bspace]
    - [Ctrl, A, S, D, F, G, H, J, K, L, ;, "'"]
    - [Shift, Z, X, C, V, B, N, M, ',', ., /, Mouse2]
    - {t: Mute, type: ghost}
    - "Mouse1"
    - {h: SYM Scroll, t: Space}
    - {h: MCR, t: Enter}
    - "Space"
    - {h: Nav, t: Space}
    - "LAlt"
    - {t: RAlt, type: ghost}
combos: 
  - {p: [25,26], k: 'Gui', l: [COLEMAK]}
  - {p: [26,27], k: 'Alt', l: [COLEMAK]}
  - {p: [32,33], k: 'Alt', l: [COLEMAK]}
  - {p: [33,34], k: 'Gui', l: [COLEMAK]}
  - {p: [16,17], k: '`', l: [COLEMAK]}
  - {p: [18,19], k: '~', l: [COLEMAK]}
  - {p: [17,18], k: 'CAPS', l: [COLEMAK]}
